name: Reusable Service Deployment

on:
  workflow_call:
    inputs:
      IIS_PATH:
        required: true
        type: string
      IIS_APPPOOL:
        required: true
        type: string

    secrets:
      WIN_EC2_HOST:
        required: true
      WIN_EC2_USER:
        required: true
      WIN_EC2_PASS:
        required: false
      WIN_EC2_PASS_KEY:
        required: false

      WIN_IIS_PATH_STAGE:
        required: false
      WIN_IIS_APPPOOL_STAGE:
        required: false
      WIN_IIS_PATH_LIVE:
        required: false
      WIN_IIS_APPPOOL_LIVE:
        required: false

jobs:
  deploy:
    runs-on: windows-latest

    env:
      WIN_IIS_PATH: ${{ secrets[inputs.IIS_PATH] }}
      WIN_IIS_APPPOOL: ${{ secrets[inputs.IIS_APPPOOL] }}

      WIN_EC2_HOST: ${{ secrets.WIN_EC2_HOST }}
      WIN_EC2_USER: ${{ secrets.WIN_EC2_USER }}
      WIN_EC2_PASS: ${{ secrets.WIN_EC2_PASS }}
      WIN_EC2_PASS_KEY: ${{ secrets.WIN_EC2_PASS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Publish with Progress Bars
        shell: pwsh
        run: |
          function Show-Progress {
              param([string]$Message, [int]$Seconds = 5)
              Write-Host ""
              Write-Host "=== $Message ===" -ForegroundColor Cyan
              for ($i = 1; $i -le $Seconds; $i++) {
                  $percent = [int](($i / $Seconds) * 100)
                  $bar = "#" * ($i * 2)
                  $space = " " * (($Seconds - $i) * 2)
                  Write-Host -NoNewline "`r[$bar$space] $percent% "
                  Start-Sleep -Seconds 1
              }
              Write-Host "`r[$('#' * ($Seconds * 2))] 100% "
              Write-Host ""
          }

          Show-Progress -Message "Installing .NET SDK" -Seconds 3

          Show-Progress -Message "Restoring dependencies" -Seconds 4
          dotnet restore TradePlatform.Api.csproj

          Show-Progress -Message "Building project" -Seconds 4
          dotnet build TradePlatform.Api.csproj -c Release --no-restore

          Show-Progress -Message "Publishing application" -Seconds 5
          dotnet publish TradePlatform.Api.csproj `
            -c Release `
            -o publish `
            --runtime win-x64 `
            --no-self-contained `
            /p:UseAppHost=false

          Show-Progress -Message "Creating deployment package" -Seconds 3
          Compress-Archive -Path publish -DestinationPath publish.zip -Force

      - name: Copy to EC2 with Progress
        shell: pwsh
        run: |
          function Show-Progress {
              param([string]$Message, [int]$Seconds = 5)
              Write-Host ""
              Write-Host "=== $Message ===" -ForegroundColor Cyan
              for ($i = 1; $i -le $Seconds; $i++) {
                  $percent = [int](($i / $Seconds) * 100)
                  $bar = "#" * ($i * 2)
                  $space = " " * (($Seconds - $i) * 2)
                  Write-Host -NoNewline "`r[$bar$space] $percent% "
                  Start-Sleep -Seconds 1
              }
              Write-Host "`r[$('#' * ($Seconds * 2))] 100% "
              Write-Host ""
          }

          Show-Progress -Message "Copying package to EC2" -Seconds 5

          $pass = $env:WIN_EC2_PASS
          if (-not $pass) { $pass = $env:WIN_EC2_PASS_KEY }

          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($env:WIN_EC2_USER, $secure)

          $session = New-PSSession `
            -ComputerName $env:WIN_EC2_HOST `
            -Credential $cred `
            -UseSSL `
            -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)

          try {
            Invoke-Command -Session $session -ScriptBlock {
              New-Item -ItemType Directory -Path "C:\deploy-temp" -Force | Out-Null
            }
            Copy-Item -Path publish.zip -Destination "C:\deploy-temp\publish.zip" -ToSession $session -Force
          }
          finally {
            Remove-PSSession $session
          }

      - name: Deploy on EC2 with Progress
        shell: pwsh
        run: |
          function Show-Progress {
              param([string]$Message, [int]$Seconds = 5)
              Write-Host ""
              Write-Host "=== $Message ===" -ForegroundColor Cyan
              for ($i = 1; $i -le $Seconds; $i++) {
                  $percent = [int](($i / $Seconds) * 100)
                  $bar = "#" * ($i * 2)
                  $space = " " * (($Seconds - $i) * 2)
                  Write-Host -NoNewline "`r[$bar$space] $percent% "
                  Start-Sleep -Seconds 1
              }
              Write-Host "`r[$('#' * ($Seconds * 2))] 100% "
              Write-Host ""
          }

          $pass = $env:WIN_EC2_PASS
          if (-not $pass) { $pass = $env:WIN_EC2_PASS_KEY }

          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($env:WIN_EC2_USER, $secure)

          $session = New-PSSession `
            -ComputerName $env:WIN_EC2_HOST `
            -Credential $cred `
            -UseSSL `
            -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)

          try {
            Invoke-Command -Session $session -ArgumentList $env:WIN_IIS_PATH, $env:WIN_IIS_APPPOOL -ScriptBlock {
              param($LIVE, $APPPOOL)

              Show-Progress -Message "Stopping IIS AppPool '$APPPOOL'" -Seconds 4
              Import-Module WebAdministration
              Stop-WebAppPool -Name $APPPOOL
              Start-Sleep -Seconds 2

              Show-Progress -Message "Deploying new version" -Seconds 6
              $TEMP = "C:\deploy-temp\publish"
              $ZIP  = "C:\deploy-temp\publish.zip"
              Expand-Archive -Path $ZIP -DestinationPath "C:\deploy-temp" -Force

              if (Test-Path $LIVE) {
                Remove-Item -Path $LIVE -Recurse -Force
              }
              Move-Item -Path $TEMP -Destination $LIVE -Force

              Show-Progress -Message "Starting IIS AppPool '$APPPOOL'" -Seconds 4
              Start-WebAppPool -Name $APPPOOL

              Write-Host "=== Deployment Completed Successfully ===" -ForegroundColor Green
            }
          }
          finally {
            Remove-PSSession $session
          }
