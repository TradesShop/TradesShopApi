name: Reusable Service Deployment

on:
  workflow_call:
    inputs:
      IIS_PATH:
        required: true
        type: string
      IIS_APPPOOL:
        required: true
        type: string

    secrets:
      WIN_EC2_HOST:
        required: true
      WIN_EC2_USER:
        required: true
      WIN_EC2_PASS:
        required: false
      WIN_EC2_PASS_KEY:
        required: false

      WIN_IIS_PATH_STAGE:
        required: false
      WIN_IIS_APPPOOL_STAGE:
        required: false
      WIN_IIS_PATH_LIVE:
        required: false
      WIN_IIS_APPPOOL_LIVE:
        required: false

jobs:
  deploy:
    runs-on: windows-latest

    env:
      WIN_IIS_PATH: ${{ secrets[inputs.IIS_PATH] }}
      WIN_IIS_APPPOOL: ${{ secrets[inputs.IIS_APPPOOL] }}

      WIN_EC2_HOST: ${{ secrets.WIN_EC2_HOST }}
      WIN_EC2_USER: ${{ secrets.WIN_EC2_USER }}
      WIN_EC2_PASS: ${{ secrets.WIN_EC2_PASS }}
      WIN_EC2_PASS_KEY: ${{ secrets.WIN_EC2_PASS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Publish
        shell: pwsh
        run: |
          dotnet publish TradePlatform.Api.csproj `
            -c Release `
            -o publish `
            --runtime win-x64 `
            --no-self-contained `
            /p:UseAppHost=false `
            /p:IncludeNativeLibrariesForSelfExtract=true

          Compress-Archive -Path publish -DestinationPath publish.zip -Force

      - name: Copy to EC2
        shell: pwsh
        run: |
          $pass = $env:WIN_EC2_PASS
          if (-not $pass) { $pass = $env:WIN_EC2_PASS_KEY }

          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($env:WIN_EC2_USER, $secure)

          $session = New-PSSession `
            -ComputerName $env:WIN_EC2_HOST `
            -Credential $cred `
            -UseSSL `
            -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)

          try {
            Invoke-Command -Session $session -ScriptBlock {
              New-Item -ItemType Directory -Path "C:\deploy-temp" -Force | Out-Null
            }

            Copy-Item -Path publish.zip -Destination "C:\deploy-temp\publish.zip" -ToSession $session -Force
          }
          finally {
            Remove-PSSession $session
          }

      - name: Deploy on EC2 (Safe Config-Protected Deployment)
        shell: pwsh
        run: |
          $pass = $env:WIN_EC2_PASS
          if (-not $pass) { $pass = $env:WIN_EC2_PASS_KEY }

          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($env:WIN_EC2_USER, $secure)

          $session = New-PSSession `
            -ComputerName $env:WIN_EC2_HOST `
            -Credential $cred `
            -UseSSL `
            -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)

          try {
            Invoke-Command -Session $session -ArgumentList $env:WIN_IIS_APPPOOL -ScriptBlock {
              param($APPPOOL)
              Import-Module WebAdministration
              Stop-WebAppPool -Name $APPPOOL
            }

            Invoke-Command -Session $session -ArgumentList $env:WIN_IIS_PATH -ScriptBlock {
              param($LIVE)

              $ZIP = "C:\deploy-temp\publish.zip"
              $TEMP = "C:\deploy-temp\publish"

              Expand-Archive -Path $ZIP -DestinationPath "C:\deploy-temp" -Force

              # Remove old binaries only
              Get-ChildItem -Path $LIVE -Include *.dll, *.exe, *.pdb -Recurse | Remove-Item -Force

              # Copy new files but protect config files
              Copy-Item -Path "$TEMP\*" -Destination $LIVE -Recurse -Force `
                -Exclude "appsettings.json","appsettings.Production.json","web.config"
            }

            Invoke-Command -Session $session -ArgumentList $env:WIN_IIS_APPPOOL -ScriptBlock {
              param($APPPOOL)
              Import-Module WebAdministration
              Start-WebAppPool -Name $APPPOOL
            }

            Write-Output "=== Deployment Completed Successfully ==="
          }
          finally {
            Remove-PSSession $session
          }
