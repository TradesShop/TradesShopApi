name: Reusable Backend Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      target_path:
        required: true
        type: string
      app_pool_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TradePlatform.Api.csproj

      - name: Build and Publish .NET App
        run: |
          dotnet publish TradePlatform.Api.csproj \
            -c Release \
            -o publish \
            --runtime win-x64 \
            --self-contained false \
            /p:UseAppHost=false \
            /p:PublishTrimmed=false \
            /p:PublishSingleFile=false

      - name: Strip Config Files & Create Zip
        run: |
          # Remove local appsettings & web.config so server configs stay untouched
          rm -f publish/appsettings*.json
          rm -f publish/web.config
          rm -f publish/.env
          
          cd publish
          zip -r ../backend.zip .

      - name: Transfer backend.zip via Native SCP
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          SERVER_IP: ${{ secrets.AWS_SERVER_IP }}
          SERVER_USER: ${{ secrets.AWS_SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 backend.zip "${SERVER_USER}@${SERVER_IP}:C:/Temp/backend.zip"

      - name: Deploy to IIS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_SERVER_IP }}
          username: ${{ secrets.AWS_SERVER_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script: |
            Import-Module WebAdministration

            $target = "${{ inputs.target_path }}"
            $previousPath = "${{ inputs.target_path }}_v_previous"
            $appPool = "${{ inputs.app_pool_name }}"
            $zipPath = "C:\Temp\backend.zip"

            # 1. Stop IIS AppPool
            Write-Host "Stopping IIS AppPool: $appPool..."
            Stop-WebAppPool -Name $appPool -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3

            # 2. Manage Backup (_v_previous)
            if (Test-Path $target) {
              Write-Host "Archiving current build to $previousPath..."
              if (Test-Path $previousPath) { Remove-Item $previousPath -Recurse -Force }
              Copy-Item -Path $target -Destination $previousPath -Recurse -Force
            } else {
              New-Item -ItemType Directory -Path $target -Force | Out-Null
            }

            # 3. Clean target folder while preserving server web.config & appsettings
            Get-ChildItem $target -Force |
              Where-Object { $_.Name -notin @("web.config", "appsettings.json", "appsettings.Production.json", "appsettings.Development.json", ".env") } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

            # 4. Extract release package
            Expand-Archive -Path $zipPath -DestinationPath $target -Force
            Remove-Item -Path $zipPath -Force

            # 5. Restart IIS AppPool
            Write-Host "Starting IIS AppPool: $appPool..."
            Start-WebAppPool -Name $appPool
            Write-Host "Backend deployment completed successfully!"