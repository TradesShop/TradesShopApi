name: Deploy TradePlatform.Api to Windows EC2 (IIS)

on:
  workflow_dispatch:
  
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore TradePlatform.Api.csproj

      - name: Clean previous builds
        shell: pwsh
        run: dotnet clean TradePlatform.Api.csproj -c Release

      - name: Publish for Windows IIS
        shell: pwsh
        run: |
          dotnet publish TradePlatform.Api.csproj `
            -c Release `
            -o publish `
            --runtime win-x64 `
            --no-self-contained `
            /p:UseAppHost=false `
            /p:PublishTrimmed=false `
            /p:PublishSingleFile=false

      - name: Zip publish folder
        shell: pwsh
        run: Compress-Archive -Path publish -DestinationPath publish.zip -Force

      #######################################################################
      # COPY TO EC2 (WINRM)
      #######################################################################
      - name: Copy files to EC2 via WinRM
        shell: pwsh
        run: |
          $pass = $env:WIN_EC2_PASS.Trim()
          if ([string]::IsNullOrWhiteSpace($pass)) {
            Write-Error "WIN_EC2_PASS is null or empty."
            exit 1
          }

          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($env:WIN_EC2_USER, $secure)

          $session = New-PSSession `
            -ComputerName $env:WIN_EC2_HOST `
            -Credential $cred `
            -UseSSL `
            -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)

          Invoke-Command -Session $session -ScriptBlock {
            New-Item -ItemType Directory -Path "C:\deploy-temp" -Force | Out-Null
          }

          Copy-Item -Path publish.zip -Destination "C:\deploy-temp\publish.zip" -ToSession $session -Force

      #######################################################################
      # DEPLOY ON EC2 (WINRM)
      #######################################################################
      - name: Deploy on EC2 via WinRM
        shell: pwsh
        run: |
          $pass = $env:WIN_EC2_PASS.Trim()
          if ([string]::IsNullOrWhiteSpace($pass)) {
            Write-Error "WIN_EC2_PASS is null or empty."
            exit 1
          }

          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($env:WIN_EC2_USER, $secure)

          $session = New-PSSession `
            -ComputerName $env:WIN_EC2_HOST `
            -Credential $cred `
            -UseSSL `
            -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)

          Invoke-Command -Session $session -ScriptBlock {
            $LIVE    = $env:WIN_IIS_PATH
            $TEMP    = "C:\deploy-temp\publish"
            $BACKUP  = "C:\deploy-backup"
            $ZIP     = "C:\deploy-temp\publish.zip"
            $APPPOOL = $env:WIN_IIS_APPPOOL

            Write-Host "Cleaning temp folder..."
            Remove-Item -Recurse -Force $TEMP -ErrorAction SilentlyContinue

            Write-Host "Extracting package..."
            Expand-Archive -Path $ZIP -DestinationPath "C:\deploy-temp" -Force

            if (!(Test-Path "$TEMP\TradePlatform.Api.dll")) {
              Write-Error "❌ DLL missing — deployment aborted."
              exit 1
            }

            Write-Host "Stopping IIS App Pool..."
            Import-Module WebAdministration
            Stop-WebAppPool $APPPOOL

            Write-Host "Backing up current version..."
            Remove-Item -Recurse -Force $BACKUP -ErrorAction SilentlyContinue
            if (Test-Path $LIVE) {
              Move-Item $LIVE $BACKUP
            }

            Write-Host "Deploying new version..."
            Move-Item $TEMP $LIVE

            Write-Host "Starting IIS App Pool..."
            Start-WebAppPool $APPPOOL

            Write-Host "Cleaning up..."
            Remove-Item $ZIP -Force

            Write-Host "Deployment successful."
          }
