name: Deploy Windows EC2 API

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    env:
      WIN_EC2_HOST: ${{ secrets.WIN_EC2_HOST }}
      WIN_EC2_USER: ${{ secrets.WIN_EC2_USER }}
      WIN_EC2_PASS: ${{ secrets.WIN_EC2_PASS }}
      WIN_EC2_PASS_KEY: ${{ secrets.WIN_EC2_PASS_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Publish API
      run: dotnet publish -c Release -o publish

    - name: Zip publish folder
      run: Compress-Archive -Path publish\* -DestinationPath publish.zip -Force

    - name: 🔍 Debug Secrets
      shell: pwsh
      run: |
        Write-Host "=== SECRET DIAGNOSTICS ==="
        Write-Host "WIN_EC2_PASS: $([string]::IsNullOrWhiteSpace($env:WIN_EC2_PASS) ? 'NULL' : 'PRESENT')"
        Write-Host "WIN_EC2_PASS_KEY: $([string]::IsNullOrWhiteSpace($env:WIN_EC2_PASS_KEY) ? 'NULL' : 'PRESENT')"

        if ($env:WIN_EC2_PASS) {
          Write-Host "WIN_EC2_PASS length: $($env:WIN_EC2_PASS.Length)"
          Write-Host "WIN_EC2_PASS preview: $($env:WIN_EC2_PASS.Substring(0,2))***"
        }

        if ($env:WIN_EC2_PASS_KEY) {
          Write-Host "WIN_EC2_PASS_KEY length: $($env:WIN_EC2_PASS_KEY.Length)"
          Write-Host "WIN_EC2_PASS_KEY preview: $($env:WIN_EC2_PASS_KEY.Substring(0,2))***"
        }

    - name: 🚀 Connect to EC2 and Deploy
      shell: pwsh
      run: |
        Write-Host "=== SELECTING PASSWORD ==="

        $p1 = $env:WIN_EC2_PASS
        $p2 = $env:WIN_EC2_PASS_KEY

        if (![string]::IsNullOrWhiteSpace($p1)) {
          Write-Host "Using WIN_EC2_PASS"
          $pass = $p1
        }
        elseif (![string]::IsNullOrWhiteSpace($p2)) {
          Write-Host "Using WIN_EC2_PASS_KEY"
          $pass = $p2
        }
        else {
          Write-Error "❌ BOTH PASSWORD SECRETS ARE NULL"
          exit 1
        }

        Write-Host "Selected password length: $($pass.Length)"
        Write-Host "Selected password preview: $($pass.Substring(0,2))***"

        $pass = $pass.Trim()
        $secure = ConvertTo-SecureString $pass -AsPlainText -Force
        $cred = New-Object System.Management.Automation.PSCredential($env:WIN_EC2_USER, $secure)

        Write-Host "=== CREATING PSSession ==="

        try {
          $session = New-PSSession `
            -ComputerName $env:WIN_EC2_HOST `
            -Credential $cred `
            -UseSSL `
            -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)

          Write-Host "✅ PSSession created successfully."
        }
        catch {
          Write-Error "❌ FAILED TO CREATE PSSession"
          Write-Error $_
          exit 1
        }

        Invoke-Command -Session $session -ScriptBlock {
          New-Item -ItemType Directory -Path "C:\deploy-temp" -Force | Out-Null
        }

        Write-Host "Folder created on EC2."

        Copy-Item -Path publish.zip -Destination "C:\deploy-temp\publish.zip" -ToSession $session -Force

        Write-Host "publish.zip copied successfully."
