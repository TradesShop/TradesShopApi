name: Deploy API to AWS EC2


on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish -c Release -o publish

    - name: Zip publish folder
      run: zip -r publish.zip publish/

    - name: Upload build to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "publish.zip"
        target: "/home/ubuntu/"

    - name: Deploy on EC2 (Zero Downtime + Rollback)
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          set -e
          LIVE="${{ secrets.EC2_API_PATH }}"
          TEMP="/var/www/api-temp"
          BACKUP="/var/www/api-backup"
          
          echo "Preparing temp folder..."
          sudo rm -rf $TEMP
          sudo mkdir -p $TEMP
          
          echo "Unzipping new build to temp..."
          sudo unzip -o /home/ubuntu/publish.zip -d $TEMP
          
          echo "Running pre-start validation..."
          # DLL is inside: $TEMP/publish/
          if [ ! -f "$TEMP/publish/TradePlatform.Api.dll" ] && [ ! -f "$TEMP/publish/TradePlatform.Api.exe" ]; then
            echo "❌ Build invalid — DLL missing. Aborting."
            exit 1
          fi
          
          echo "Stopping service..."
          sudo systemctl stop ${{ secrets.EC2_SERVICE }}
          
          echo "Creating backup of current live version..."
          sudo rm -rf $BACKUP
          sudo mv $LIVE $BACKUP
          
          echo "Promoting temp to live..."
          sudo mv $TEMP/publish $LIVE
          
          echo "Starting service..."
          sudo systemctl start ${{ secrets.EC2_SERVICE }}
          
          echo "Checking service health..."
          sleep 3
          if ! sudo.systemctl is-active --quiet ${{ secrets.EC2_SERVICE }}; then
            echo "❌ Service failed to start — rolling back..."
            sudo rm -rf $LIVE
            sudo mv $BACKUP $LIVE
            sudo systemctl restart ${{ secrets.EC2_SERVICE }}
            echo "Rollback complete."
            exit 1
          fi
          
          echo "Deployment successful."
          sudo journalctl -u ${{ secrets.EC2_SERVICE }} -n 50 --no-pager

