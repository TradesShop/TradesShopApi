name: Deploy Windows EC2 API

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    env:
      WIN_EC2_HOST: ${{ secrets.WIN_EC2_HOST }}
      WIN_EC2_USER: ${{ secrets.WIN_EC2_USER }}
      WIN_EC2_PASS: ${{ secrets.WIN_EC2_PASS }}
      WIN_EC2_PASS_KEY: ${{ secrets.WIN_EC2_PASS_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish API
      run: |
        dotnet publish -c Release -o publish

    - name: Zip publish folder
      run: |
        Compress-Archive -Path publish\* -DestinationPath publish.zip -Force

    - name: Debug Secrets
      shell: pwsh
      run: |
        Write-Host "=== Checking Secrets ==="

        if ($env:WIN_EC2_PASS) { Write-Host "WIN_EC2_PASS: PRESENT" } else { Write-Host "WIN_EC2_PASS: NULL" }
        if ($env:WIN_EC2_PASS_KEY) { Write-Host "WIN_EC2_PASS_KEY: PRESENT" } else { Write-Host "WIN_EC2_PASS_KEY: NULL" }

    - name: Connect to EC2 and Deploy
      shell: pwsh
      run: |
        Write-Host "=== Selecting Password ==="

        $pass1 = $env:WIN_EC2_PASS
        $pass2 = $env:WIN_EC2_PASS_KEY

        if (![string]::IsNullOrWhiteSpace($pass1)) {
            Write-Host "Using WIN_EC2_PASS"
            $pass = $pass1
        }
        elseif (![string]::IsNullOrWhiteSpace($pass2)) {
            Write-Host "Using WIN_EC2_PASS_KEY"
            $pass = $pass2
        }
        else {
            Write-Error "❌ Both WIN_EC2_PASS and WIN_EC2_PASS_KEY are NULL or empty."
            exit 1
        }

        Write-Host "Password length: $($pass.Length)"
        Write-Host "Password preview: $($pass.Substring(0,2))***"

        $pass = $pass.Trim()
        $secure = ConvertTo-SecureString $pass -AsPlainText -Force
        $cred = New-Object System.Management.Automation.PSCredential($env:WIN_EC2_USER, $secure)

        Write-Host "=== Creating PSSession ==="

        $session = New-PSSession `
            -ComputerName $env:WIN_EC2_HOST `
            -Credential $cred `
            -UseSSL `
            -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck)

        Write-Host "PSSession created successfully."

        Invoke-Command -Session $session -ScriptBlock {
            New-Item -ItemType Directory -Path "C:\deploy-temp" -Force | Out-Null
        }

        Write-Host "Folder created on EC2."

        Copy-Item -Path publish.zip -Destination "C:\deploy-temp\publish.zip" -ToSession $session -Force

        Write-Host "publish.zip copied successfully."
