name: Deploy TradesShop.Api to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish TradePlatform.Api.csproj \
            --configuration Release \
            --output publish

      - name: Zip publish folder
        run: zip -r publish.zip publish/

      - name: Upload build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "publish.zip"
          target: "/home/ubuntu/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            LIVE="${{ secrets.EC2_API_PATH }}"
            TEMP="/var/www/api-temp"
            BACKUP="/var/www/api-backup"
            SERVICE="${{ secrets.EC2_SERVICE }}"

            echo "=================================="
            echo "Starting Deployment"
            echo "=================================="

            echo "Cleaning temp directory..."
            sudo rm -rf "$TEMP"
            sudo mkdir -p "$TEMP"

            echo "Extracting deployment package..."
            sudo unzip -o /home/ubuntu/publish.zip -d "$TEMP"

            echo "Validating deployment package..."
            if [ ! -f "$TEMP/publish/TradePlatform.Api.dll" ]; then
              echo "❌ TradePlatform.Api.dll not found."
              exit 1
            fi

            echo "Stopping service..."
            sudo systemctl stop "$SERVICE"

            echo "Preparing backup..."
            sudo rm -rf "$BACKUP"
            if [ -d "$LIVE" ]; then
              sudo mv "$LIVE" "$BACKUP"
            fi

            echo "Promoting new release..."
            sudo mkdir -p "$(dirname "$LIVE")"
            sudo mv "$TEMP/publish" "$LIVE"

            echo "Setting permissions..."
            sudo chmod -R 755 "$LIVE"

            echo "Reloading systemd..."
            sudo systemctl daemon-reload || true

            echo "Starting service..."
            sudo systemctl start "$SERVICE"

            echo "Waiting for application startup..."
            sleep 10

            echo "Checking service status..."
            if ! sudo systemctl is-active --quiet "$SERVICE"; then
              echo "❌ Service failed to start."
              echo "Rolling back..."

              sudo rm -rf "$LIVE"
              if [ -d "$BACKUP" ]; then
                sudo mv "$BACKUP" "$LIVE"
              fi

              sudo systemctl restart "$SERVICE"
              echo "Rollback completed."
              exit 1
            fi

            echo "Cleaning up..."
            sudo rm -f /home/ubuntu/publish.zip

            echo "Deployment successful."

            echo "Recent service logs:"
            sudo journalctl -u "$SERVICE" -n 50 --no-pager
