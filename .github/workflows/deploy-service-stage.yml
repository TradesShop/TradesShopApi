name: Deploy Service Stage

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml

    with:
      IIS_PATH: WIN_IIS_PATH_STAGE
      IIS_APPPOOL: WIN_IIS_APPPOOL_STAGE

    secrets:
      WIN_IIS_PATH_STAGE: ${{ secrets.WIN_IIS_PATH_STAGE }}
      WIN_IIS_APPPOOL_STAGE: ${{ secrets.WIN_IIS_APPPOOL_STAGE }}
      WIN_EC2_HOST: ${{ secrets.WIN_EC2_HOST }}
      WIN_EC2_USER: ${{ secrets.WIN_EC2_USER }}
      WIN_EC2_PASS: ${{ secrets.WIN_EC2_PASS }}
      WIN_EC2_PASS_KEY: ${{ secrets.WIN_EC2_PASS_KEY }}
