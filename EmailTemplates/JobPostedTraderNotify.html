<div>

    <h2>Hi {{TraderName}},</h2>

    <p>A new job lead has been posted near you.</p>

    <!-- Posted Job -->
    <div class="job-card">
        <h3>{{PostedJob.title}}</h3>
        <div>{{{PostedJob.description}}}</div>

        <div class="tds-btn-center">
            <a href="{{PostedJob.job_url}}" class="primary-btn">View Job</a>
        </div>
    </div>

    <!-- Recent Jobs -->
    <h3>Jobs Posted Recently</h3>

    {{#each RecentJobs}}
    <div class="job-card">

        <div class="job-header">
            <strong>{{Title}}</strong></span>
            <span class="view-btn"><a href="{{job_url}}" class="secondary-btn">View</a></span>
        </div>

        <div>{{{Description}}}</div>

    </div>
    {{/each}}
    <div class="tds-btn-center">
        <a href="{{MyJobsUrl}}" class="primary-btn">View All Leads</a>
    </div>


</div>
